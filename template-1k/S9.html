<style>
  @page { size: A4; margin: 0; }
  /* overflow + a hair under the page height: Chrome spills a second, blank
     page if the body reaches exactly 297mm */
  html, body { margin: 0; padding: 0; overflow: hidden; }
  body { width: 210.0mm; height: 296.6mm; position: relative;
          font-family: "Microsoft YaHei","Noto Sans CJK SC",sans-serif; }
  .mark { position: absolute; width: 8.0mm; height: 8.0mm;
           box-sizing: border-box; border: 4.0mm solid #000; }
  .cell { position: absolute; width: 17.8mm; height: 17.8mm;
           box-sizing: border-box; border: 0.3mm solid #e23b32;
           overflow: hidden; }
  .cell i { position: absolute; display: block; }
  .h { left: 0; top: 50%; width: 100%; border-top: 0.2mm dashed #f2a9a4; }
  .v { top: 0; left: 50%; height: 100%; border-left: 0.2mm dashed #f2a9a4; }
  /* 米字格 diagonals: a full-width rule through the middle, rotated about its
     own centre and stretched to the diagonal. The cell clips the ends. */
  .d1, .d2 { left: 0; top: 50%; width: 100%;
              border-top: 0.2mm dashed #f2a9a4;
              transform-origin: 50% 50%; }
  .d1 { transform: rotate(45deg) scaleX(1.4143); }
  .d2 { transform: rotate(-45deg) scaleX(1.4143); }
  .lab { position: absolute; width: 17.8mm; height: 4.4mm;
          color: #e23b32; font-size: 3.1mm; line-height: 4.4mm;
          text-align: center; }
  .hdr { position: absolute; left: 16.0mm; top: 20mm;

</style>
